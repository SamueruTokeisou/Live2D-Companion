<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>伙伴文字对话 · Codex</title><style>
*{box-sizing:border-box}body{margin:0;padding:22px;background:#f3f7fb;color:#173449;font:15px 'Microsoft YaHei UI',sans-serif}h1{font-size:23px;margin:0 0 8px}.note{font-size:13px;color:#536b7a;line-height:1.7}#status{font-weight:bold;margin:12px 0}#messages{height:330px;overflow:auto;background:white;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}.message{padding:10px 14px;border-radius:12px;max-width:94%;white-space:pre-wrap;overflow-wrap:anywhere}.user{align-self:flex-end;background:#dcecf8}.assistant{align-self:flex-start;background:#edf3f6}.meta{font-size:12px;color:#637a89;margin-bottom:6px}#error{color:#a52d39;min-height:22px;margin:8px 0}form{display:flex;gap:8px}textarea{flex:1;resize:vertical;min-height:70px;max-height:150px;font:inherit;border:1px solid #bbcddb;border-radius:9px;padding:10px}button{font:inherit;padding:10px 14px;border:1px solid #bbcddb;border-radius:9px;background:#edf5fb;cursor:pointer}button:disabled,textarea:disabled{opacity:.5}#send{background:#215e82;color:white}.controls{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}#usage{padding:10px;background:#e7eef4;border-radius:9px;font-size:12px;line-height:1.8}</style></head>
<body><h1>伙伴文字对话</h1><p class="note">使用已有的 Codex / ChatGPT 登录进行云端文字对话。发送的文字与最近三轮上下文会交给云端模型，使用账号可用额度。本阶段只聊天，不操作电脑。</p><div id="status" role="status">尚未验证真实对话</div><div id="messages" role="log" aria-live="polite"></div><div id="error" role="alert"></div><form id="input"><textarea id="text" maxlength="500" required aria-label="对话内容" placeholder="输入一句话；可随时停止，或发送新一句打断"></textarea><button id="send">发送</button></form><div class="controls"><button id="stop">停止回应</button><button id="clear">清空本次对话</button><button id="toggle">关闭对话</button></div><div id="usage"></div><p class="note">近期文字只保留在本进程内；关闭程序后不保留。清空对话不重置调用限额。点击、待机仍使用本地逻辑；后端出错不影响桌宠。账号和服务端的数据处理规则以 OpenAI 设置为准。</p><script src="./chat-panel.js" type="module"></script></body></html>
