<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>伙伴文字对话 · ChatGPT</title><style>
*{box-sizing:border-box}body{margin:0;padding:16px;background:#f3f7fb;color:#173449;font:15px 'Microsoft YaHei UI',sans-serif}h1{font-size:23px;margin:0 0 8px}.note{font-size:13px;color:#536b7a;line-height:1.5;margin:6px 0}#status{font-weight:bold;margin:12px 0}#messages{height:clamp(120px,23vh,200px);overflow:auto;background:white;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}.message{padding:10px 14px;border-radius:12px;max-width:94%;white-space:pre-wrap;overflow-wrap:anywhere}.user{align-self:flex-end;background:#dcecf8}.assistant{align-self:flex-start;background:#edf3f6}.meta{font-size:12px;color:#637a89;margin-bottom:6px}#error{color:#a52d39;min-height:22px;margin:8px 0}form{display:flex;gap:8px}textarea{flex:1;resize:vertical;min-height:70px;max-height:150px;font:inherit;border:1px solid #bbcddb;border-radius:9px;padding:10px}select{font:inherit;max-width:270px;padding:8px;border-radius:8px}#welcome{padding:12px;background:#fff3cd;border-radius:9px}button{font:inherit;padding:10px 14px;border:1px solid #bbcddb;border-radius:9px;background:#edf5fb;cursor:pointer}button:disabled,textarea:disabled{opacity:.5}#send{background:#215e82;color:white}.controls{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}#usage{padding:10px;background:#e7eef4;border-radius:9px;font-size:12px;line-height:1.8}</style></head>
<body><h1>伙伴文字对话</h1><p class="note">输入中文，伙伴用中文回答。聊天使用已授权的 ChatGPT 套餐，朗读由本机语音服务提供。</p><div class="controls"><select id="accounts" aria-label="ChatGPT账号"></select><button id="login">Continue with ChatGPT</button><button id="add-account">添加账号</button><button id="logout">退出账号</button><button id="cancel-login" hidden>取消登录</button></div><div id="auth-status" role="status"></div><div class="controls"><select id="models" aria-label="对话模型"></select><button id="reload-models">刷新模型</button><button id="manage-usage">查看套餐用量</button></div><div id="welcome" hidden><strong>You're using your ChatGPT plan</strong><p class="note">正在使用 ChatGPT 套餐：桌宠聊天将占用适用的会员额度，与其他应用共享限制。不会自动切换 API 付费。请在 ChatGPT 用量设置管理额度。</p><button id="ack">Got it · 知道了</button></div><div id="status" role="status">尚未验证真实对话</div><div class="controls"><label for="volume">朗读音量</label><input id="volume" type="range" min="0" max="100" step="1" value="70" aria-label="朗读音量"><output id="volume-value" for="volume">70%</output><button id="voice-check" type="button">检查语音服务</button></div><p id="voice-status" class="note" role="status">语音服务尚未检查</p><div id="messages" role="log" aria-live="polite"></div><div id="error" role="alert"></div><form id="input"><textarea id="text" maxlength="500" required aria-label="对话内容" placeholder="可输入中文；中文回答／中文字幕。可随时停止"></textarea><button id="send">发送</button></form><div class="controls"><button id="stop">停止回应</button><button id="clear">清空本次对话</button><button id="toggle">关闭对话</button><button id="voice" disabled>声音准备中</button></div><details><summary>用量与隐私说明</summary><div id="usage"></div><p class="note">近期文字只保留在本进程内；关闭程序后不保留。清空对话不重置调用限额。点击、待机仍使用本地逻辑；后端出错不影响桌宠。账号和服务端的数据处理规则以 OpenAI 设置为准。</p></details><script src="./chat-panel.js" type="module"></script></body></html>
