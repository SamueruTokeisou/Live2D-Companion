<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>伙伴内核 · 本地测试</title>
<style>body{margin:0;padding:24px;background:#f3f7fb;color:#173449;font:15px 'Microsoft YaHei UI',sans-serif}h1{font-size:24px;margin:0 0 8px}.note{color:#536b7a;line-height:1.7}section{padding:16px;background:white;border-radius:14px;margin:16px 0}button,input{font:inherit;padding:10px;border:1px solid #bbcddb;border-radius:8px}button{cursor:pointer;background:#edf5fb;margin:4px}button:disabled{opacity:.5}form{display:flex;gap:8px}input{flex:1;min-width:0}#status{font-size:20px;font-weight:bold}#error{color:#a52d39;min-height:22px}pre{font-size:12px;white-space:pre-wrap;max-height:220px;overflow:auto}label{display:inline-block;margin:10px}#queue{color:#536b7a}</style></head>
<body><h1>伙伴内核 · 本地测试</h1><p class="note">这是 P2 调度测试，按固定本地规则回应，尚未接入 AI。关闭测试后，桌宠继续按原方式互动。文字仅在本次进程内使用。</p>
<section><div id="status" role="status">正在连接…</div><p id="queue"></p><p id="capabilities"></p><form id="input"><input id="text" aria-label="本地测试文字" placeholder="输入一句话，验证回应和打断" maxlength="500" required><button>发送测试</button></form><div id="error" role="alert"></div>
<button id="stop">停止并清空待办</button><button id="pause">暂停</button><button id="timer">两秒计时事件</button><button id="clicks">连续点击测试 × 5</button><button id="idle">待机事件</button><br><label><input type="checkbox" id="quiet">免打扰（只接收文字）</label><button id="disable">关闭内核测试</button></section>
<section><strong>事件与结果（不显示输入内容）</strong><pre id="events"></pre></section><script src="./kernel-panel.js" type="module"></script></body></html>
